name: Build Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks

      - name: Create signing.properties
        run: |
          echo "keystore=keystore.jks" > signing.properties
          echo "keystore.password=${{ secrets.KEY_PASSWORD }}" >> signing.properties
          echo "keystore.alias=${{ secrets.KEY_ALIAS }}" >> signing.properties

      - name: Build Release APK
        run: bash gradlew assembleConversationsFreeRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: conversations-free-release
          path: build/outputs/apk/conversationsFree/release/*.apk
