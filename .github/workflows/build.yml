name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate and Move keystore
        run: |
          keytool -genkey -v \
            -keystore keystore.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias my-key-alias \
            -dname "CN=Conversations, OU=Dev, O=Dev, L=Moscow, S=Moscow, C=RU" \
            -storepass mypassword123 \
            -keypass mypassword123
          mkdir -p conversations
          cp keystore.jks conversations/keystore.jks

      - name: Create signing.properties
        run: |
          # Указываем путь к ключу относительно папки conversations
          echo "keystore=keystore.jks" > conversations/signing.properties
          echo "keystore.password=mypassword123" >> conversations/signing.properties
          echo "keystore.alias=my-key-alias" >> conversations/signing.properties
          echo "key.password=mypassword123" >> conversations/signing.properties

      - name: Grant execute permission
        run: chmod +x gradlew

      # ИСПОЛЬЗУЕМ СБОРКУ С ЯВНОЙ ПЕРЕДАЧЕЙ СВОЙСТВ
      - name: Build Release APK
        run: ./gradlew assembleConversationsFreeRelease -PsigningConfigPath=conversations/signing.properties

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: conversations-signed-release
          # Ищем любой файл, даже если он раньше был unsigned
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
          retention-days: 7
