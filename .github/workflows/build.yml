name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: Setup Android NDK r21e
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r21e
          add-to-path: false

      - name: Build Yggdrasil SOCKS AAR
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          # Clone yggdrasil-go as dependency source
          git clone --depth=1 --branch v0.5.12 \
            https://github.com/yggdrasil-network/yggdrasil-go /tmp/yggdrasil-go

          # Set up our wrapper module
          mkdir -p /tmp/yggmobile
          cp -r $GITHUB_WORKSPACE/.yggmobile/* /tmp/yggmobile/ 2>/dev/null || true

          # Create wrapper module inline
          printf 'module github.com/conversations-patched/yggdrasil-socks\n\ngo 1.21\n\nrequire (\n\tgithub.com/yggdrasil-network/yggdrasil-go v0.5.12\n\tgolang.org/x/mobile v0.0.0-20231127183840-76ac6878050a\n)\n\nreplace github.com/yggdrasil-network/yggdrasil-go => /tmp/yggdrasil-go\n' > /tmp/yggmobile/go.mod

          mkdir -p /tmp/yggmobile/yggmobile
          cp $GITHUB_WORKSPACE/yggmobile/yggmobile.go /tmp/yggmobile/yggmobile/

          cd /tmp/yggmobile
          go get -tool golang.org/x/mobile/cmd/gobind@latest
          go mod tidy
          gomobile bind \
            -target android/arm64,android/arm,android/amd64 \
            -androidapi 21 \
            -o /tmp/yggmobile.aar \
            ./yggmobile/

          mkdir -p $GITHUB_WORKSPACE/libs
          cp /tmp/yggmobile.aar $GITHUB_WORKSPACE/libs/yggdrasil.aar
          cp /tmp/yggmobile-sources.jar $GITHUB_WORKSPACE/libs/yggdrasil-sources.jar

      - name: Inspect Yggdrasil AAR classes
        run: |
          unzip -p $GITHUB_WORKSPACE/libs/yggdrasil.aar classes.jar > /tmp/classes.jar
          echo "=== mobile.Yggdrasil methods ==="
          javap -p -cp /tmp/classes.jar mobile.Yggdrasil
          echo "=== mobile.Mobile methods ==="
          javap -p -cp /tmp/classes.jar mobile.Mobile
          echo "=== config.NodeConfig methods ==="
          javap -p -cp /tmp/classes.jar config.NodeConfig

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleConversationsFreeDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: conversations-patched-debug
          path: build/outputs/apk/conversationsFree/debug/*.apk
          retention-days: 7
