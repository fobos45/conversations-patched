name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: Build Yggdrasil AAR
        run: |
          git clone --depth=1 https://github.com/yggdrasil-network/yggdrasil-go /tmp/yggdrasil-go
          cd /tmp/yggdrasil-go
          gomobile bind \
            -target android/arm64,android/arm,android/amd64 \
            -androidapi 21 \
            -o /tmp/yggdrasil.aar \
            ./...
          mkdir -p $GITHUB_WORKSPACE/libs
          cp /tmp/yggdrasil.aar $GITHUB_WORKSPACE/libs/yggdrasil.aar
          cp /tmp/yggdrasil-sources.jar $GITHUB_WORKSPACE/libs/yggdrasil-sources.jar

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleConversationsFreeDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: conversations-patched-debug
          path: build/outputs/apk/conversationsFree/debug/*.apk
          retention-days: 7
