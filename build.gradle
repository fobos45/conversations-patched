// Корневой build.gradle
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.0.1'
        classpath 'com.diffplug.spotless:spotless-plugin-gradle:8.4.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url='https://jitpack.io'}
    }
}
